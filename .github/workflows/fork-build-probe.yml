name: fork build probe

# Diagnostics without local API access: the runner's own token reads the Actions and Releases API and commits
# the answer to the ci-probe branch. Retargeted by editing this file, which is the only trigger besides manual runs.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fork-build-probe.yml']

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p probe
          gh api "repos/${{ github.repository }}/releases?per_page=10" > probe/releases.json || true
          gh api "repos/${{ github.repository }}/actions/runs?per_page=20" > probe/runs.json || true
          run=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=20" \
                --jq '[.workflow_runs[] | select(.name=="fork release")][0].id')
          echo "fork release run: ${run:-none}" > probe/summary.txt
          if [ -n "$run" ] && [ "$run" != "null" ]; then
            gh api "repos/${{ github.repository }}/actions/runs/$run" > probe/run.json || true
            gh api "repos/${{ github.repository }}/actions/runs/$run/jobs" > probe/jobs.json || true
            gh api "repos/${{ github.repository }}/actions/runs/$run/jobs" --jq '
              .jobs[] | "\(.name) → \(.status)/\(.conclusion)",
              (.steps[] | "    \(.number). \(.name) → \(.conclusion)")' >> probe/summary.txt
            gh api "repos/${{ github.repository }}/check-runs?filter=latest" > /dev/null 2>&1 || true
            for job in $(gh api "repos/${{ github.repository }}/actions/runs/$run/jobs" --jq '.jobs[].id'); do
              gh api "repos/${{ github.repository }}/check-runs/$job/annotations" >> "probe/annotations-$job.json" 2>/dev/null || true
            done
          fi
          gh api "repos/${{ github.repository }}/releases" --jq '.[] | "\(.tag_name) draft=\(.draft) prerelease=\(.prerelease) assets=\([.assets[].name] | join(","))"' >> probe/summary.txt
          cat probe/summary.txt

      - name: Commit
        if: always()
        run: |
          git config user.name "phonebox-ci"
          git config user.email "ci@localhost"
          git checkout -B ci-probe
          git add -f probe
          git commit -m "probe: run diagnostics for $GITHUB_SHA" || echo "nothing to commit"
          for i in 1 2 3; do git push origin ci-probe --force && break; sleep 5; done
